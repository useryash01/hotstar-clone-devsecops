apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: hotstar-vpa
  namespace: default
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hotstar-clone

  updatePolicy:
    updateMode: "InPlaceOrRecreate"

  resourcePolicy:
    containerPolicies:
      - containerName: hotstar
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: 1000m
          memory: 512Mi
