apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-alerts
  namespace: monitoring
spec:
  route:
    receiver: slack
    matchers:                        # <-- 1. ADD these 4 lines (stops Watchdog spam,
      - name: severity               #        routes all warning & critical alerts)
        matchType: "=~"
        value: "warning|critical"
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook-url  # <-- KEEP as-is (references the K8s Secret, not raw URL)
            key: url
          channel: "#hotstar-alerts" # <-- 2. CHANGE only if your Slack channel name is different
          sendResolved: true
