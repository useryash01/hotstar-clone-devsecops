apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: slack-alerts
  namespace: monitoring
spec:
  route:
    receiver: slack
    groupBy:
      - alertname
      - namespace
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h

  receivers:
    - name: slack
      slackConfigs:
        - apiURL:
            name: slack-webhook-url
            key: url
          channel: "#hotstar-alerts"
          sendResolved: true
